# ==============================================================================
# BLOCO DE VIRTUAL HOST NGINX NA VPS (Para /etc/nginx/sites-available/mandato)
# Domínio: mandato.democracias.org
# ==============================================================================

# Redirecionamento HTTP -> HTTPS (gerenciado pelo Cloudflare ou Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name mandato.democracias.org;

    # Se estiver usando Cloudflare com SSL Full/Strict ou Certbot:
    location / {
        return 301 https://$host$request_uri;
    }

    # Desafio Let's Encrypt (caso utilize certbot nativo na VPS)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
}

# Bloco Principal HTTPS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mandato.democracias.org;

    # Certificados SSL (Substitua pelos caminhos reais do Certbot ou Cloudflare Origin CA)
    # ssl_certificate /etc/letsencrypt/live/mandato.democracias.org/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mandato.democracias.org/privkey.pem;

    # Parâmetros de Segurança SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Roteamento do Frontend (MandatoGov Web UI na porta 3080)
    location / {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # 2. Roteamento da API PostgREST (Opcional: expor API em /api/)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Limite de Upload de Arquivos (Ex: currículos PDF, portarias)
    client_max_body_size 50M;
}
